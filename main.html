
<!DOCTYPE html>
<html lang="en">
<head>

    <title>My Accessible Portfolio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

        <a href="#skills">Skills</a>
        <a href="#contact">Contact</a>

    <!-- Image -->

        role="img"
        src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400"

    >

    <!-- Description -->
    <div id="about">
        <h2>About Me</h2>

            Hello! I am a web development student.

        </p>

    <!-- Skills list -->
    <div id="skills">
        <h2>My Skills</h2>

        <ul role="list">
            <li role="listitem">HTML</li>
            <li role="listitem">CSS</li>
            <li role="listitem">JavaScript</li>
        </ul>
    </div>

    <!-- Contact -->
    <div id="contact">
        <h2>Contact Me</h2>
        <p>Email: harshitha@gmail.com</p>
    </div>

</body>
</html>
